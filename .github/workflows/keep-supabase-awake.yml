name: Keep Supabase awake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase every 5 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            days_since_epoch=$(( $(date -u +%s) / 86400 ))
            if [ $(( days_since_epoch % 5 )) -ne 0 ]; then
              echo "Skipping today; Supabase keepalive runs every 5 days."
              exit 0
            fi
          fi

          curl -fsS \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/action_links?select=id&limit=1"

          echo "Supabase keepalive ping completed."
